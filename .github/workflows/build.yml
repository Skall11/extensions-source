name: Build Poseidon Debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Poseidon debug
        run: ./gradlew :src:fr:poseidonscans:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: poseidon-debug-apk
          path: "**/*debug*.apk"
